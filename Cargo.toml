[package]
name = "composelint"
version = "0.1.0"
edition = "2021"
description = "Lints a docker-compose.yml for common misconfigurations — unpinned images, no restart policy, host networking, privileged containers, unbound published ports"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/composelint"
readme = "README.md"
keywords = ["docker", "docker-compose", "lint", "cli", "devops"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "composelint"
path = "src/lib.rs"

[[bin]]
name = "composelint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
